plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.99'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/main/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        dataRuntime {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/runtime/resources/').getAbsolutePath(), '--existing', file('src/runtime/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.runtime)
        }
        "${core_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
//sourceSets.main.resources { srcDir 'src/generated/resources' }

sourceSets {
    main {
        java {
            srcDir 'src/java'
        }
        resources {
            srcDir 'src/main/resources'
            srcDir 'src/generated/main/resources'
        }
    }
    runtime {
        java {
            srcDir 'src/runtime/java'
        }
        resources {
            srcDir 'src/runtime/resources'
            srcDir 'src/generated/runtime/resources'
        }
        compileClasspath += main.compileClasspath;
        compileClasspath += main.output;
    }
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    // NeoForge
    maven {
        url = "https://maven.neoforged.net/releases"
    }

    // CurseMaven
    maven {
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    // Modrinth
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    // Curios
    maven {
        url = "https://maven.theillusivec4.top"
        content {
            includeGroupByRegex "top\\.theillusivec4.*"
            includeGroupByRegex "com\\.illusivesoulworks.*"
        }
    }

    // The One Probe
    maven {
        url = "https://maven.k-4u.nl"
        content {
            includeGroup "mcjty.theoneprobe"
        }
    }

    // Patchouli、JEI
    maven {
        url = "https://maven.blamejared.com"
        content {
            includeGroup "vazkii.patchouli"
            includeGroupByRegex "net\\.darkhax.*"
            includeGroupByRegex "com\\.blamejared.*"
            includeGroup "org.openzen.zencode"
            includeGroup "mezz.jei"
        }
    }

    // Shadows of Fire（Placebo / Apotheosis）
    maven {
        // Shadows
        url "https://maven.shadowsoffire.dev/releases"
        content {
            includeGroup "dev.shadowsoffire"
            includeGroup "snownee.jade"
        }
    }

    maven { url = "https://maven.shedaniel.me/" } // Cloth Config
    maven { url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" } // Geckolib
    maven { url = "https://maven.kosmx.dev/" } // Player Animator
    maven { url = "https://jitpack.io" }

    // Iron's Spellbooks
    maven {
        name = "Iron's Maven - Release"
        url = "https://code.redspace.io/releases"
    }
    maven {
        name = "Iron's Maven - Snapshots"
        url = "https://code.redspace.io/snapshots"
    }
}

configurations {
    runtimeClasspath            .extendsFrom localRuntime
    runtimeRuntimeClasspath     .extendsFrom compileClasspath
    runtimeImplementation       .extendsFrom implementation
    runtimeAnnotationProcessor  .extendsFrom annotationProcessor
}

dependencies {
    implementation "dev.shadowsoffire:Placebo:${minecraft_version}-${placebo_version}"
    implementation "dev.shadowsoffire:ApothicAttributes:${minecraft_version}-${apothicAttributesVersion}"
    implementation "dev.shadowsoffire:Apotheosis:${minecraft_version}-${apotheosis_version}"
}

var generateCoreModMetadata = tasks.register("generateCoreModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            core_id                : core_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/main/sources/modMetadata"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateRuntimeModMetadata = tasks.register("generateRuntimeModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            core_id                : core_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            apotheosis_version     : apotheosis_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/runtime/templates"
    into "build/generated/runtime/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateCoreModMetadata
sourceSets.runtime.resources.srcDir generateRuntimeModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateCoreModMetadata
neoForge.ideSyncTask generateRuntimeModMetadata

tasks.register("generateBuildInfo") {
    def outputDir = layout.buildDirectory.dir("generated/sources/buildinfo").get().asFile
    def version = project.version;
    outputs.dir(outputDir)
    // force to run everytime
    outputs.upToDateWhen { false }
    doLast {
/*        if (outputDir.exists()) {
            outputDir.deleteDir()
        }*/
        def pkg = "net.rtxyd.fallen.lib.config"
        def dir = new File(outputDir, pkg.replace('.', '/'))
        dir.mkdirs()

        new File(dir, "BuildInfo.java").text = """
            package ${pkg};

            /**
             * Auto-generated by Gradle.
             * DO NOT EDIT.
             */
            public final class BuildInfo {
                public static final String VERSION = "${version}";
                private BuildInfo() {}
            }
        """.stripIndent()
    }
}

sourceSets.main.java.srcDirs(
        layout.buildDirectory.dir("generated/sources/buildinfo")
)
//sourceSets.main.resources.srcDir(
//        layout.buildDirectory.dir("generated/sources/runtime")
//)
compileJava.dependsOn("generateBuildInfo")
//processResources.dependsOn("generateMetaData")

tasks.register('jarCoreLib', Jar) {
    from(sourceSets.main.output)
//    from(zipTree(tasks.jar.outputs.files.singleFile))
//    exclude 'META-INF/mods.toml'
//    exclude 'META-INF/runtime'
//    exclude 'META-INF/runtime/*'
//    exclude 'net/rtxyd/fallen_dev_helper/FallenLib.class'
    archiveClassifier.set('core')
}

tasks.register('jarRuntime', Jar) {
    from(sourceSets.runtime.output)
    archiveClassifier.set('runtime')
}

tasks.withType(Jar).forEach { t ->
    if (t.getName().equals('jar')) {
        return;
    }
    else {
        var title = mod_id + '-' + t.archiveClassifier.get()
        var attrs = [
                'Specification-Title'     : title,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ]
        if (t.getName().equals('jarRuntime')) {
            attrs.MixinConnector = mixin_connector
        }
        t.configure {
            manifest {
                attributes(attrs)
            }
        }
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id + '-all',
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    exclude 'net/rtxyd/fallen_dev_helper/FallenLib.class'
    exclude "${mod_id}.refmap.json"

    // This is the preferred method to reobfuscate your jar file
    from(tasks.jarRuntime.outputs) {
        into 'META-INF/runtime'
    }
    dependsOn 'jarRuntime'
    finalizedBy 'jarCoreLib'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
            artifact jarCoreLib
            artifact jarRuntime
            groupId = 'io.github.rtxyd'
            artifactId = 'fallen-lib'
            version = project.version
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE  // or DuplicatesStrategy.INCLUDE, DuplicatesStrategy.FAIL
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
